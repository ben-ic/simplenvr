[package]
name = "tether"
version = "0.1.0"
edition = "2021"
description = "Cross-platform parent-death child supervisor: when the parent dies (for any reason, including SIGKILL), the wrapped child dies too."
license = "MIT OR Apache-2.0"

[[bin]]
name = "tether"
path = "src/main.rs"

[dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

