[workspace]
members = [".", "tether"]

# Optimize the tether binary for size — it's a tiny supervisor that
# ships alongside ffmpeg/go2rtc and should add negligible bundle size.
[profile.release.package.tether]
opt-level = "z"
codegen-units = 1
strip = true

[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["macos-private-api", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# parking_lot::Mutex does not poison on panic and has no unwrap(), so the
# many lock sites in lib.rs become infallible. Previously every panic in
# a task holding a std::sync::Mutex would poison it and every subsequent
# .lock().unwrap() would cascade into app-level crashes.
parking_lot = "0.12"
tauri-plugin-rtsp-mosaic = { path = "../../tauri-plugin-rtsp-mosaic" } # TODO: revert to git after testing

[target.'cfg(unix)'.dependencies]
libc = "0.2"
